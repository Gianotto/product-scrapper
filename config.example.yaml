# Alert configuration
alerts:
  webhook_url: "${N8N_WEBHOOK_URL}"  # Read from .env; never hardcode
  triggers:
    price_drop_percent: 5            # Alert if price drops 5%+ since last check
    below_target: true               # Alert whenever price is at or below target_price
    back_in_stock: true              # Alert when item transitions from out-of-stock to in-stock
  cooldown_minutes: 360              # Minimum minutes between identical alerts (6 hours)
