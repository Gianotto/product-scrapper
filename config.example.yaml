# General settings
general:
  user_agents_rotation: true
  request_timeout_seconds: 30
  max_retries: 3
  retry_backoff_seconds: 5
  parallel_requests: false  # Sequential by default (safer, less detectable)

# Per-store settings
stores:
  bestbuy:
    enabled: true
    rate_limit_seconds: 3
    use_api: false  # BestBuy has API but requires key; set BESTBUY_API_KEY in .env

  amazon:
    enabled: true
    rate_limit_seconds: 5
    use_scraperapi: false  # Toggle to use ScraperAPI if SCRAPERAPI_KEY is set in .env

  newegg:
    enabled: true
    rate_limit_seconds: 3

  asus_shop:
    enabled: true
    rate_limit_seconds: 3

  ebay:
    enabled: true
    rate_limit_seconds: 3
    use_api: false  # Set true + add EBAY_CLIENT_ID/EBAY_CLIENT_SECRET to .env to use Browse API

